<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>verif livre</title>
<style>body{margin:0;background:#111;color:#8f8;font-family:monospace;font-size:13px;padding:12px;white-space:pre-wrap}
iframe{width:390px;height:780px;border:6px solid #000;border-radius:24px;display:block;margin-top:10px}</style>
</head><body>
<div id="mes">mesure…</div>
<iframe id="f" src="about:blank"></iframe>
<script>
(async () => {
  const l = [];
  try {
    for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    for (const n of await caches.keys()) await caches.delete(n);
    l.push("caches et service worker purges");
  } catch (e) { l.push("purge impossible: " + e.message); }
  const f = document.getElementById("f");
  f.src = "index.html?t=" + Date.now();
  f.onload = () => setTimeout(() => {
    try {
      const d = f.contentDocument, w = f.contentWindow;
      const bot = d.querySelector("#panneau-bot"), menu = d.querySelector("#panneau-menu"), voile = d.querySelector("#voile");
      const css = (el) => w.getComputedStyle(el).display;
      l.push("panneau-bot display  : " + css(bot));
      l.push("panneau-menu display : " + css(menu));
      l.push("voile display        : " + css(voile));
      l.push("pages construites    : " + (w.__livre ? w.__livre.total() : "?"));
      l.push("index courant        : " + (w.__livre ? w.__livre.index() : "?"));
      const couv = d.querySelector("#couverture");
      l.push("couverture z-index   : " + w.getComputedStyle(couv).zIndex + " (doit etre eleve)");
      const page1 = d.querySelectorAll(".feuille")[1];
      l.push("page 1 z-index       : " + (page1 ? w.getComputedStyle(page1).zIndex : "?"));
      // test du bot
      if (w.__livre) {
        const r1 = w.__livre.repondre("combien coute un bot WhatsApp ?");
        l.push("Q: combien coute un bot WhatsApp ?");
        l.push("R: (page " + (r1.page + 1) + ") " + r1.texte.slice(0, 120));
        const r2 = w.__livre.repondre("quelles erreurs éviter ?");
        l.push("Q: quelles erreurs éviter ?");
        l.push("R: (page " + (r2.page + 1) + ") " + r2.texte.slice(0, 100));
      }
      document.getElementById("mes").textContent = l.join("\n");
    } catch (e) {
      document.getElementById("mes").textContent = l.join("\n") + "\nerreur: " + e.message;
    }
  }, 2600);
})();
</script></body></html>
