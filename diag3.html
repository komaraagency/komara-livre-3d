<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>diag3</title>
<style>body{margin:0;background:#111;color:#9f9;font-family:monospace;font-size:12px;padding:10px;white-space:pre-wrap}
iframe{width:390px;height:600px;border:4px solid #333;border-radius:18px;display:block;margin-top:8px}</style>
</head><body>
<div id="mes">mesure…</div>
<iframe id="f" src="about:blank"></iframe>
<script>
(async () => {
  const l = [];
  try {
    for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    for (const n of await caches.keys()) await caches.delete(n);
    l.push("caches purges");
  } catch (e) { l.push("purge: " + e.message); }

  const f = document.getElementById("f");
  f.src = "index.html?t=" + Date.now();
  f.onload = () => setTimeout(() => {
    try {
      const w = f.contentWindow;
      const L = w.LIVRE || {};
      const api = w.__livre || {};
      l.push("pages dans les donnees : " + (L.pages || []).length);
      l.push("pages avec mots-cles : " + (L.pages || []).filter(p => p.motsCles).length);
      l.push("pages construites (total) : " + (api.total ? api.total() : "?"));
      l.push("cles de __livre : " + Object.keys(api).join(", "));
      l.push("");
      [
        "combien coute un site vitrine ?",
        "quelles erreurs eviter ?",
        "c est quoi un agent IA premium ?",
        "combien coute un bot WhatsApp ?",
        "comment structurer un bot ?",
        "qui est komara ?"
      ].forEach(q => {
        const r = api.repondre ? api.repondre(q) : { texte: "?", page: -1 };
        l.push("Q " + q);
        l.push("  page " + ((r.page || 0) + 1) + " | " + (r.texte || "").slice(0, 70));
      });
      afficher(l);
    } catch (e) { afficher(l.concat(["ERREUR " + e.message])); }
  }, 2200);
  function afficher(x) { document.getElementById("mes").textContent = x.join("\n"); }
})();
</script>
</body></html>
